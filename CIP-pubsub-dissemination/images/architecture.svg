<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 492" width="860" height="492" role="img" aria-labelledby="t d">
<title id="t">The protocol at a glance</title>
<desc id="d">Three numbered bands read downward. Band 1 holds the four services the protocol reads: a node registry, a topic registry, a parameter output and a per-epoch randomness beacon, contributing membership, publication policy, the epoch length and the epoch randomness respectively. Every node turns those public inputs into its registered peers on a topic, applies the verifiable gate, picks from the survivors with its own private randomness, and holds the resulting links for the epoch; the gate gives a shared decision verifiable by both endpoints, while the pick uses private randomness. Messages then travel over those links from publisher through any number of relays to subscribers, signed once end to end. The beacon is drawn dashed because it may be provided off the chain; address resolution, which feeds the dial rather than the derivation, is read once a peer has been drawn.</desc>
