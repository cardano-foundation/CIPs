<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 486" width="860" height="486" role="img" aria-labelledby="t d">
<title id="t">M4 measurements and reference predictions</title>
<desc id="d">One design, the symmetric relay link. The upper row is the ungated comparison point at nine picks: solid marks are failure rates counted in simulation at weaker configurations, the hollow mark the law's prediction at the comparison point, and the dashed span between them is carried by the law alone. The lower row is the gated reference configuration, k = 10, B = 500, C = 23: a prediction of the composed gated law, beside the one reported sample, zero failures in four hundred draws, and the prediction under wholesale flooding by every adversarial identity. The bucket-count table gives B = 512 at this population; that point has not been re-run and is not shown.</desc>
<rect width="860" height="486" rx="8" fill="#fcfcfb"/>
<line x1="329.4" y1="80.0" x2="329.4" y2="352.0" stroke="#e2e0d8" stroke-width="1"/>
<text x="329.4" y="372.0" font-size="11.5" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">10⁻⁵</text>
<text x="329.4" y="386.0" font-size="9.5" fill="#6f6d66" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">1 in 100,000</text>
<line x1="425.9" y1="80.0" x2="425.9" y2="352.0" stroke="#e2e0d8" stroke-width="1"/>
<text x="425.9" y="372.0" font-size="11.5" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">10⁻⁴</text>
<text x="425.9" y="386.0" font-size="9.5" fill="#6f6d66" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">1 in 10,000</text>
