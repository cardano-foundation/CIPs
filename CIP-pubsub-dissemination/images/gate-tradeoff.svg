<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 586" width="860" height="586" role="img" aria-labelledby="t d">
<title id="t">The bucket count trade-off, measured on M2 (historical)</title>
<desc id="d">Two stacked panels sharing a bucket-count axis, where selection headroom r is the number of peers the gate leaves a node eligible to link to, divided by the number it must pick. Coverage stays on the ungated law while selection headroom is at least 2, then rises fivefold at headroom 1 and collapses below it. Attacker concentration falls as the reciprocal of the bucket count throughout, measured at four of the seven bucket counts and predicted at the rest. The largest bucket count retaining headroom is best on both. Historical: measured on the directional M2 design at pick count 16 in experiments E10 and E12; the selected symmetric design at pick count 10 uses a separate candidate bucket table and requires validation against its coverage law.</desc>
