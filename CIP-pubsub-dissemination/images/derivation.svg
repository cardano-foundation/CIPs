<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 298" width="860" height="298" role="img" aria-labelledby="t d">
<title id="t">Deriving one node's links for one epoch</title>
<desc id="d">Three rows of markers over the same peers. The first row is every other node whose entry is active and lists the topic at the epoch's registration cutoff. The second marks those for which the verifiable gate holds, roughly one in B of them. The third marks the k the node actually picks from that eligible set, drawn with its own randomness. The first row is public; pairwise eligibility in the second must be verifiable by both endpoints. The evaluated hash baseline also makes the second row public. The third is the node's own draw and is private.</desc>
