<text x="38.0" y="80.0" font-size="10.5" fill="#6f6d66" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">its k_in senders drawn · grey: their outbound draws</text>
