<title id="t">One node's links under M5</title>
<desc id="d">Both outer layers now hold links in the design's colour: the current node draws its k_in senders above and its k_out receivers below, tuning the two counts separately. Grey links are the same two draws made by other nodes that happened to land on this one. Messages flow downward on every link.</desc>
