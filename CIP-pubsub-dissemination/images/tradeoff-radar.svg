<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 642" width="860" height="642" role="img" aria-labelledby="t d">
<title id="t">Four-way trade-off across the surviving designs</title>
<desc id="d">One radar chart overlaying M2, M3 and M4 on four axes: bandwidth economy, connection economy, speed and churn tolerance, all oriented outward-is-better. Each is labelled at the axis where it reaches the outer ring. M4 reaches it on connection economy and on churn tolerance, and is the most even shape; M3 reaches it on bandwidth alone and sits under a third of the way out on churn tolerance; M2 reaches it on speed and is innermost on the other three. M5 and M1 are drawn as muted grey shapes with a faint fill and a solid outline, M1 nested inside M5: each lies inside or on a contending design on every axis, which is what being dominated looks like. The churn axis is the only dashed line in the figure, marking that it is read off the coverage law rather than sampled.</desc>
