<text x="248.0" y="307.0" font-size="10.5" fill="#6f6d66" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="end">M3 2.17 · M4 7.43 · M2 1.7</text>
<text x="248.0" y="323.0" font-size="10" fill="#6f6d66" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="end">dashed axis: read off the law, not sampled</text>
<text x="38.0" y="556.0" font-size="11" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-style="italic">Every axis is oriented so that outward is better.</text>
<text x="38.0" y="572.0" font-size="11" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-style="italic">Each design is scored against the best of the three and labelled at the axis where it leads.</text>
<text x="38.0" y="588.0" font-size="11" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-style="italic">Three axes are measured directly; the dashed one, churn tolerance, is read off the coverage law, whose behaviour under churn was measured separately.</text>
<text x="38.0" y="604.0" font-size="11" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-style="italic">Radial position is the ratio to the best value on that axis, so half-way out is half as good; the centre is zero downtime, or unbounded cost.</text>
<text x="846.0" y="631.0" font-size="9.5" fill="#6f6d66" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="end">N = 20 000 · μ = 0.2 · δ = 10⁻⁴</text>
</svg>
