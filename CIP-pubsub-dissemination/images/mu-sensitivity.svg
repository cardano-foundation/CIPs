<title id="t">The proposed configurations as the adversarial fraction varies</title>
<desc id="d">Each design's failure probability read off its coverage law as the adversarial fraction moves, the configuration held fixed. The designs do not degrade at equal rates: M4 at RF = 9 stays inside the target to μ = 0.259, M3 at (13, 7) to 0.217, and the dots mark where each design crosses it.</desc>
