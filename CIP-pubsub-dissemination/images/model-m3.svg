<title id="t">One node's links under M3</title>
<desc id="d">M2's layers with one addition. The top row holds the RF relay forwarders the current node drew. The bottom row holds, dashed and in the design's colour, the s minus 1 seeding links the node initiates to hand out its own publications, beside the grey relay draws made by others. Messages flow downward on every link.</desc>
