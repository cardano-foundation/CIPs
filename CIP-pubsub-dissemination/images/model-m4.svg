<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-labelledby="t d">
<title id="t">One node's links under M4</title>
<desc id="d">The upstream and downstream layers are gone; what remains is who opened each link. The top row holds the RF peers the current node drew, the bottom row the peers whose draws landed on it, and every arrow points both ways because a link carries messages in both directions whichever end opened it.</desc>
<rect width="860" height="330" rx="8" fill="#fcfcfb"/>
<text x="38.0" y="62.0" font-size="12.5" fill="#1a1a19" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-weight="600">Its picks</text>
<text x="38.0" y="80.0" font-size="10.5" fill="#6f6d66" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">this node initiated these; messages flow both ways</text>
